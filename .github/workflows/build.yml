name: build

on:
  push:
    branches: [main, develop, 'refactor/**']
  pull_request:

jobs:
  core:
    name: core modules (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -ntp verify -pl '!apiro-desktop'

  webmvc-plain:
    name: plain Spring MVC ${{ matrix.spring }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring: [5.3.39, 6.2.0, 7.0.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -ntp verify -pl apiro-spring-webmvc -am -Dspring.framework.version=${{ matrix.spring }}

  boot:
    name: Boot ${{ matrix.boot }} on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { boot: 2.7.18, java: 8 }
          - { boot: 2.7.18, java: 17 }
          - { boot: 3.2.12, java: 17 }
          - { boot: 3.5.16, java: 17 }
          - { boot: 4.0.7, java: 17 }
          - { boot: 4.1.2, java: 17 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: maven
      - name: Build upstream modules
        run: mvn -B -ntp install -DskipTests -pl apiro-spring-webmvc -am
      - name: Test starter
        run: |
          JVM=""
          if [ "${{ matrix.java }}" = "8" ]; then JVM="-Djvm=$JAVA_HOME_8_X64/bin/java"; fi
          mvn -B -ntp verify -pl apiro-spring-boot-starter -Dspring.boot.baseline=${{ matrix.boot }} $JVM